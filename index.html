<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marte</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2a1408; overflow: hidden; }
    canvas { display: block; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(30,10,0,.45) 100%); }
    #hud { position: fixed; left: 16px; bottom: 16px; padding: 10px 14px; border-radius: 8px; color: #f3d2ae; background: rgba(40,16,4,.55); font: 13px/1.5 system-ui, sans-serif; pointer-events: none; backdrop-filter: blur(3px); }
    #hud .loading { display: block; } #hud .controls { display: none; }
    #hud.ready .loading { display: none; } #hud.ready .controls { display: block; }
    #hud kbd, .mc kbd { display: inline-block; min-width: 1.4em; padding: 0 5px; text-align: center; border: 1px solid #d49a64; border-radius: 4px; background: rgba(255,200,140,.12); font: 600 12px ui-monospace, monospace; }

    /* Control de misión (tecla T) */
    .mc { position: fixed; top: 16px; right: 16px; z-index: 5; width: min(430px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 12px; border-radius: 10px; color: #f3d2ae; background: rgba(34,13,3,.72); border: 1px solid rgba(212,154,100,.35); box-shadow: 0 8px 30px rgba(0,0,0,.35); backdrop-filter: blur(5px); font: 13px/1.45 system-ui, sans-serif; transition: opacity .22s ease, transform .22s ease, visibility 0s linear 0s; }
    .mc.mc-hidden { opacity: 0; transform: translateX(28px); visibility: hidden; pointer-events: none; transition: opacity .22s ease, transform .22s ease, visibility 0s linear .22s; }
    .mc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .mc-eyebrow { font: 600 10.5px ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: #d49a64; }
    .mc-title { font-size: 16px; font-weight: 600; letter-spacing: .01em; }
    .mc-hint { color: rgba(243,210,174,.7); font-size: 12px; white-space: nowrap; }
    .mc-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .mc-card { appearance: none; text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 10px 10px 9px; border-radius: 8px; border: 1px solid rgba(212,154,100,.22); border-left: 3px solid var(--c); background: rgba(255,200,140,.06); transition: background .15s, border-color .15s; }
    .mc-card:hover { background: rgba(255,200,140,.12); }
    .mc-card[aria-pressed="true"] { background: rgba(255,200,140,.16); border-color: var(--c); }
    .mc-card:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
    .mc-name { font: 600 10.5px ui-monospace, Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; color: rgba(243,210,174,.8); }
    .mc-valrow { display: flex; align-items: baseline; gap: 6px; }
    .mc-val { font: 600 24px/1.1 ui-monospace, Consolas, monospace; color: var(--c); font-variant-numeric: tabular-nums; }
    .mc-unit { font: 12px ui-monospace, Consolas, monospace; color: rgba(243,210,174,.75); }
    .mc-explain { font-size: 11.5px; line-height: 1.4; color: rgba(243,210,174,.82); }
    .mc-prov { margin-top: auto; padding-top: 3px; display: flex; align-items: center; gap: 6px; font: 10px/1.3 ui-monospace, Consolas, monospace; color: rgba(243,210,174,.58); }
    .mc-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: rgba(243,210,174,.4); }
    .mc-card.live .mc-dot { background: #5cc9b5; animation: mcpulse 1.6s ease-in-out infinite; }
    @keyframes mcpulse { 50% { opacity: .25; } }
    .mc-chart { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 8px; background: rgba(0,0,0,.18); border: 1px solid rgba(212,154,100,.18); }
    .mc-chart-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .mc-chart-title { font-size: 12.5px; }
    .mc-chart-read { font: 11.5px ui-monospace, Consolas, monospace; color: #f3d2ae; }
    .mc-canvas { width: 100%; height: 150px; touch-action: none; }
    .mc-chart-foot, .mc-foot { font-size: 11px; line-height: 1.4; color: rgba(243,210,174,.6); }
    /* Cámaras de Percy: tooltip y visor de fotos */
    .cam-tip { position: fixed; z-index: 6; width: 230px; display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-radius: 8px; color: #f3d2ae; background: rgba(34,13,3,.92); border: 1px solid rgba(110,230,255,.5); box-shadow: 0 6px 22px rgba(0,0,0,.4); font: 12px/1.4 system-ui, sans-serif; pointer-events: none; }
    .cam-tip[hidden] { display: none; }
    .cam-tip b { font-size: 14px; color: #fff; }
    .cam-tip span { font: 11px ui-monospace, Consolas, monospace; color: #7ff3ff; }
    .cam-tip em { font-style: normal; color: rgba(243,210,174,.8); }
    .cam-tip i { font-style: normal; color: #f0954f; margin-top: 3px; }

    .ph { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; opacity: 0; visibility: hidden; pointer-events: none; color: #f3d2ae; font: 13px/1.45 system-ui, sans-serif; background: radial-gradient(ellipse at center, rgba(14,5,0,.55), rgba(10,3,0,.86)); transition: opacity .28s ease, visibility 0s linear .28s; --mw: min(520px, 80vw); --mh: 40vh; }
    .ph.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .2s ease; }
    .ph[data-size="large"] { --mw: min(1200px, 94vw); --mh: calc(100vh - 170px); }
    .ph[data-size="full"] { background: rgba(8,3,0,.95); }
    .ph-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    .ph-stage { position: relative; max-width: 100vw; max-height: 100vh; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .ph-close { position: fixed; top: 14px; right: 16px; appearance: none; cursor: pointer; font: 600 12px ui-monospace, Consolas, monospace; color: #f3d2ae; background: rgba(255,200,140,.12); border: 1px solid #d49a64; border-radius: 6px; padding: 6px 10px; }
    .ph-close:hover { background: rgba(255,200,140,.22); }
    .ph-card { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .ph-frame { position: relative; overflow: hidden; line-height: 0; border-radius: 6px; border: 1px solid rgba(255,225,190,.55); background: #1b0b03; box-shadow: 0 14px 50px rgba(0,0,0,.6); cursor: zoom-in; }
    .ph[data-size="full"] .ph-frame { cursor: zoom-out; }
    .ph-img { display: block; width: auto; height: auto; max-width: var(--mw); max-height: var(--mh); transition: max-width .5s ease, max-height .5s ease; }
    .ph[data-size="full"] .ph-img { width: 98vw; height: calc(100vh - 100px); max-width: none; max-height: none; object-fit: contain; }
    .ph-scan { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #7ff3ff; box-shadow: 0 0 14px 3px rgba(127,243,255,.85); opacity: 0; pointer-events: none; }
    .ph figcaption { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
    .ph-meta { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 16px; }
    .ph-cam { font-size: 20px; color: #fff; letter-spacing: .01em; }
    .ph-sol { font: 600 15px ui-monospace, Consolas, monospace; color: #7ff3ff; }
    .ph-ago { font-size: 15px; color: #f0954f; }
    .ph-keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; color: rgba(243,210,174,.8); font-size: 12px; }
    .ph kbd { display: inline-block; min-width: 1.4em; padding: 0 5px; text-align: center; border: 1px solid #d49a64; border-radius: 4px; background: rgba(255,200,140,.12); font: 600 12px ui-monospace, monospace; }
    .ph-credit { font: 10.5px ui-monospace, Consolas, monospace; color: rgba(243,210,174,.5); }
    @media (prefers-reduced-motion: reduce) { .ph, .ph.on, .ph-img { transition: none; } }
    @media (prefers-reduced-motion: reduce) { .mc, .mc.mc-hidden { transition: none; } .mc-card.live .mc-dot { animation: none; } }
    @media (max-width: 560px) { .mc-cards { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <div class="vignette"></div>
  <div id="hud">
    <div class="loading">Cargando rover Perseverance…</div>
    <div class="controls"><kbd>W</kbd> avanzar · <kbd>S</kbd> retroceder · <kbd>A</kbd> <kbd>D</kbd> girar · <kbd>T</kbd> control de misión<br>Clic en los puntos brillantes: fotos de Marte · Velocidad: <span class="speed">0.0</span> m/s</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
